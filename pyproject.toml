[project]
name = "toshiba-print-bridge"
version = "0.1.0"
description = "Local PDF print bridge for Windows GDI printers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=5,<7", "filelock>=3.16,<4"]

[project.optional-dependencies]
desktop = ["pystray>=0.19,<1; sys_platform == 'win32'", "Pillow>=11,<13; sys_platform == 'win32'", "pywin32>=308; sys_platform == 'win32'"]

[dependency-groups]
build = ["pyinstaller>=6,<7; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
